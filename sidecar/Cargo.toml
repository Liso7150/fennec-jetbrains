[package]
name = "fennec-sidecar"
version = "2.5.0"
edition = "2021"
license = "MIT"
description = "Fennec JetBrains sidecar: ACP launcher/supervisor and the context JSON-RPC surface."

[workspace]

[lib]
name = "fennec_sidecar"
path = "src/lib.rs"

[[bin]]
name = "fennec-acp"
path = "src/main.rs"

[dependencies]
fennec-client = { path = "../../fennec-core/src/fennec-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true